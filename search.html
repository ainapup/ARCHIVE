<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ARCHIVE — Search</title>

  <link
    rel="stylesheet"
    href="style.css?v=20261005-search-final"
  >

</head>


<body>


  <header class="site-header"></header>


  <main class="search-page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <section class="search-header">

      <div class="search-kicker">
        ARCHIVE / SEARCH
      </div>


      <h1>
        Search
      </h1>


      <p>
        Search the archive by place,
        architect or destination.
      </p>

    </section>



    <!-- =====================================
         SEARCH INPUT
    ====================================== -->

    <section class="search-interface">

      <label
        class="search-label"
        for="global-search-input"
      >
        Search
      </label>


      <div class="search-input-wrap">

        <input
          id="global-search-input"
          type="search"
          placeholder="Place, architect or destination"
          autocomplete="off"
          spellcheck="false"
        >


        <span
          class="search-result-total"
          id="search-result-total"
        >
          00 RESULTS
        </span>

      </div>

    </section>



    <!-- =====================================
         RESULTS
    ====================================== -->

    <section
      id="search-results"
      class="search-results"
    >

      <div class="search-empty-state">

        Search the archive by place,
        architect or destination.

      </div>

    </section>


  </main>



  <script src="projects.js?v=20261005-search-final"></script>

  <script src="architects-data.js?v=20261005-search-final"></script>

  <script src="search.js?v=20261005-search-final"></script>

  <script src="navigation.js"></script>


</body>

</html>
