<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ARCHIVE — Search</title>

  <link
    rel="stylesheet"
    href="style.css?v=20261005-search2"
  >

</head>


<body>


  <header class="site-header"></header>


  <main class="search-page">


    <section class="search-header">

      <div class="search-kicker">
        ARCHIVE / SEARCH
      </div>


      <h1>
        Search
      </h1>


      <p>
        Search the archive by place,
        architect or destination.
      </p>

    </section>



    <section class="search-interface">

      <label
        class="search-label"
        for="global-search-input"
      >
        Search
      </label>


      <div class="search-input-wrap">

        <div class="search-field">

          <input
            id="global-search-input"
            type="search"
            placeholder="Place, architect or destination"
            autocomplete="off"
            spellcheck="false"
          >


          <button
            type="button"
            id="search-clear"
            class="search-clear"
            aria-label="Clear search"
          >
            ×
          </button>

        </div>


        <span
          class="search-result-total"
          id="search-result-total"
        >
          00 RESULTS
        </span>

      </div>

    </section>



    <section
      id="search-results"
      class="search-results"
    >

      <div class="search-empty-state">

        Search the archive by place,
        architect or destination.

      </div>

    </section>


  </main>



  <script src="projects.js?v=20261005-search2"></script>

  <script src="architects-data.js?v=20261005-search2"></script>

  <script src="search.js?v=20261005-search2"></script>

  <script src="navigation.js"></script>


</body>

</html>
