<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ARCHIVE — Destinations</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- =====================================
       GLOBAL HEADER
  ====================================== -->

  <header class="site-header"></header>



  <!-- =====================================
       MAIN
  ====================================== -->

  <main class="destinations-page">


    <!-- =================================
         INTRO
    ================================== -->

    <section class="destinations-hero">

      <div class="destinations-kicker">
        ARCHIVE / DESTINATIONS
      </div>


      <h1>
        Destinations
      </h1>


      <p class="destinations-intro">
        Explore architecture through place.
      </p>

    </section>



    <!-- =================================
         DESTINATION CONTENT
    ================================== -->

    <section
      class="destinations-controls"
      id="destinations-content"
    >


      <!-- CONTINENT FILTERS -->

      <div
        id="continent-filters"
        class="continent-filters"
      ></div>



      <!-- COUNTRY SELECTOR -->

      <div class="country-selector">

        <label for="country-select">
          Destination
        </label>


        <select id="country-select">

          <option value="">
            Select destination
          </option>

        </select>

      </div>


    </section>



    <!-- =================================
         DESTINATIONS GRID
    ================================== -->

    <section
      id="destinations-grid"
      class="destinations-grid"
    ></section>


  </main>



  <!-- =====================================
       SCRIPTS
  ====================================== -->

  <script src="projects.js"></script>

  <script src="destinations.js"></script>

  <script src="navigation.js"></script>


</body>

</html>
