<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ARCHIVE — Map</title>

  <link
    rel="stylesheet"
    href="style.css?v=20261005-map-final"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

</head>


<body>


  <header class="site-header"></header>


  <main class="map-page">


    <section class="map-header">

      <div class="map-kicker">
        ARCHIVE / MAP
      </div>


      <h1>
        Map
      </h1>


      <p>
        Explore places through geography,
        use and architecture.
      </p>

    </section>



    <section class="map-controls">


      <div class="map-control-block">

        <div class="map-control-label">
          TYPE
        </div>


        <div
          class="map-type-filters"
          id="map-type-filters"
        >

          <button
            type="button"
            class="map-type-filter active"
            data-type="ALL"
          >
            ALL
          </button>

          <button
            type="button"
            class="map-type-filter"
            data-type="STAY"
          >
            STAY
          </button>

          <button
            type="button"
            class="map-type-filter"
            data-type="EAT"
          >
            EAT
          </button>

          <button
            type="button"
            class="map-type-filter"
            data-type="DRINK"
          >
            DRINK
          </button>

          <button
            type="button"
            class="map-type-filter"
            data-type="VISIT"
          >
            VISIT
          </button>

        </div>

      </div>



      <div class="map-control-block map-control-architect">

        <label
          class="map-control-label"
          for="map-architect-select"
        >
          ARCHITECT
        </label>


        <select id="map-architect-select">

          <option value="ALL">
            All architects
          </option>

        </select>

      </div>



      <div class="map-control-count">

        <span id="map-result-count">
          00 PLACES
        </span>

      </div>


    </section>



    <section class="map-section">

      <div id="archive-map"></div>

    </section>


  </main>



  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script src="projects.js?v=20261005-map-final"></script>

  <script src="map.js?v=20261005-map-final"></script>

  <script src="navigation.js"></script>


</body>

</html>
