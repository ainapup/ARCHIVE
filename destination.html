<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ARCHIVE — Destination</title>

  <link rel="stylesheet" href="style.css">

</head>

<body class="destination-detail-body">

  <header class="site-header"></header>


  <main class="destination-detail-page">

    <section class="destination-detail-header">

      <div class="destination-detail-kicker">
        ARCHIVE / DESTINATION
      </div>

      <h1 id="destination-title">
        Destination
      </h1>

      <div class="destination-detail-meta">

        <span id="destination-continent">
          —
        </span>

        <span id="destination-count">
          00 places
        </span>

      </div>

      <div class="destination-switcher">

        <label for="destination-select">
          Change destination
        </label>

        <select id="destination-select">

          <option value="">
            Select destination
          </option>

        </select>

      </div>

    </section>


    <section
      id="destination-projects"
      class="destination-projects"
    ></section>

  </main>


  <script src="projects.js"></script>
  <script src="destination.js"></script>
  <script src="navigation.js"></script>

</body>

</html>
