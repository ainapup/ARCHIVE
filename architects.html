  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header class="site-header"></header>


  <main class="architects-page">

      <p>

      <input
        type="search"
        id="architect-search"
        placeholder="Search architect or studio..."

    </section>


    <section class="architects-list">

      <div id="architects-index"></div>

    </section>

  </main>


  <script src="projects.js"></script>
