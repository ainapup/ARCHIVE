media:
  input: images
  output: /ARCHIVE/images
  rename: safe

content:

  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    format: json
    list: true

    fields:

      - name: id
        label: ID
        type: string
        required: true

      - name: title
        label: Project / Place name
        type: string
        required: true


      # =====================================
      # ARCHITECTS
      # =====================================

      - name: architects
        label: Architects / Studios
        type: object
        list: true

        fields:

          - name: name
            label: Architect / Studio name
            type: string
            required: true

          - name: id
            label: Architect ID
            type: string
            required: true


      # =====================================
      # LOCATION
      # =====================================

      - name: city
        label: City
        type: string
        required: true

      - name: country
        label: Country
        type: string
        required: true

      - name: continent
        label: Continent
        type: select
        required: true
        options:
          values:
            - Europe
            - Asia
            - Africa
            - North America
            - South America
            - Oceania


      # =====================================
      # ARCHITECTURE
      # =====================================

      - name: year
        label: Year
        type: string

      - name: description
        label: Description
        type: text

      - name: architectureWebsite
        label: Architecture website
        type: string


      # =====================================
      # MAP
      # =====================================

      - name: latitude
        label: Latitude
        type: number

      - name: longitude
        label: Longitude
        type: number


      # =====================================
      # PLACE CATEGORY
      # =====================================

      - name: type
        label: Main category
        type: select
        required: true
        options:
          values:
            - STAY
            - EAT
            - DRINK
            - VISIT


      - name: placeType
        label: Place type
        type: string

      - name: serviceMode
        label: Access / Service mode
        type: string

      - name: capacity
        label: Capacity
        type: string


      # =====================================
      # PRICE
      # =====================================

      - name: priceFrom
        label: Price from
        type: number

      - name: currency
        label: Currency
        type: select
        options:
          values:
            - €
            - $
            - £
            - ¥

      - name: priceNote
        label: Price unit
        type: string

      - name: priceLevel
        label: Price level
        type: select
        options:
          values:
            - €
            - €€
            - €€€
            - €€€€


      # =====================================
      # BOOKING / VISIT
      # =====================================

      - name: bookingUrl
        label: Booking / Reservation URL
        type: string

      - name: visitUrl
        label: Visit / Tickets URL
        type: string


      # =====================================
      # IMAGES
      # =====================================

      - name: images
        label: Images
        type: image
        options:
          multiple:
            max: 20


      # =====================================
      # AWARDS
      # =====================================

      - name: awards
        label: Awards
        type: object
        list: true

        fields:

          - name: name
            label: Award name
            type: string

          - name: year
            label: Year
            type: string

          - name: recognition
            label: Recognition
            type: select
            options:
              values:
                - Winner
                - Laureate
                - Finalist
                - Shortlisted
                - Nominee
                - Special Mention
                - Commended
                - Selected
                - Other

          - name: url
            label: Award link
            type: string



  # =========================================================
  # ARCHITECTS
  # =========================================================

  - name: architects
    label: Architects
    type: file
    path: data/architects.json
    format: json
    list: true

    fields:

      - name: id
        label: ID
        type: string
        required: true

      - name: name
        label: Architect / Studio name
        type: string
        required: true

      - name: category
        label: Type
        type: select
        required: true
        options:
          values:
            - Architect
            - Architecture studio
            - Designer
            - Design studio

      - name: location
        label: Based in
        type: string

      - name: birthYear
        label: Born
        type: string

      - name: deathYear
        label: Died
        type: string

      - name: foundedYear
        label: Founded
        type: string

      - name: closedYear
        label: Closed
        type: string

      - name: founders
        label: Founders
        type: string
        list: true

      - name: description
        label: Biography / Studio description
        type: text

      - name: website
        label: Official website
        type: string

      - name: image
        label: Image
        type: image


      # =====================================
      # ARCHITECT AWARDS
      # =====================================

      - name: awards
        label: Awards & Recognition
        type: object
        list: true

        fields:

          - name: name
            label: Award name
            type: string

          - name: year
            label: Year
            type: string

          - name: recognition
            label: Recognition
            type: select
            options:
              values:
                - Winner
                - Laureate
                - Finalist
                - Shortlisted
                - Nominee
                - Special Mention
                - Commended
                - Selected
                - Other

          - name: url
            label: Award link
            type: string
