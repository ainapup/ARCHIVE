media:
  input: images
  output: /ARCHIVE/images
  rename: safe

content:

  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    format: json
    list: true

    fields:

      - name: id
        label: ID
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use only lowercase letters, numbers and hyphens"

      - name: title
        label: Project / Place name
        type: string
        required: true

      - name: architect
        label: Architect / Studio
        type: string
        required: true

      - name: city
        label: City
        type: string
        required: true

      - name: country
        label: Country
        type: string
        required: true

      - name: continent
        label: Continent
        type: select
        required: true
        options:
          values:
            - Europe
            - Asia
            - Africa
            - North America
            - South America
            - Oceania

      - name: type
        label: Type
        type: select
        required: true
        options:
          values:
            - STAY
            - EAT
            - DRINK
            - VISIT

      - name: year
        label: Year
        type: string

      - name: description
        label: Description
        type: text

      - name: latitude
        label: Latitude
        type: number

      - name: longitude
        label: Longitude
        type: number

      - name: images
        label: Images
        type: image
        options:
          multiple:
            max: 20

      - name: architectureWebsite
        label: Architecture website
        type: string

      - name: bookingUrl
        label: Booking URL
        type: string

      - name: priceFrom
        label: Price from
        type: number

      - name: currency
        label: Currency
        type: select
        options:
          values:
            - €
            - $
            - £
            - ¥

      - name: priceNote
        label: Price note
        type: string


  - name: architects
    label: Architects
    type: file
    path: data/architects.json
    format: json
    list: true

    fields:

      - name: id
        label: ID
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Use only lowercase letters, numbers and hyphens"

      - name: name
        label: Architect / Studio name
        type: string
        required: true

      - name: category
        label: Type
        type: select
        options:
          values:
            - Architect
            - Architecture studio
            - Designer
            - Design studio

      - name: location
        label: Based in
        type: string

      - name: description
        label: Biography / Studio description
        type: text

      - name: website
        label: Official website
        type: string

      - name: image
        label: Image
        type: image
